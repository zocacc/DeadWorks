name: Test and build DeadWorks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download verified Godot 4.7.2
        run: |
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import and test
        env:
          GODOT_BIN: ${{ runner.temp }}/Godot_v4.7.2-stable_linux.x86_64
        run: bash tools/test-headless.sh
      - name: Cache Windows export template
        id: windows-template
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-windows-x64-template-v1
      - name: Install verified Windows export template
        if: steps.windows-template.outputs.cache-hit != 'true'
        run: |
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/export_templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          python tools/install_windows_export_template.py "$RUNNER_TEMP/export_templates.tpz"
      - name: Export Windows x64
        env:
          GODOT_BIN: ${{ runner.temp }}/Godot_v4.7.2-stable_linux.x86_64
        run: bash tools/export-windows.sh
      - name: Publish Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DeadWorks-Windows-x64
          path: |
            builds/windows/DeadWorks.exe
            builds/windows/DeadWorks.pck
          if-no-files-found: error
